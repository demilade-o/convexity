name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: a dependency that was clean at merge can be vulnerable by Monday.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: github/codeql-action/init@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
        with:
          category: "/language:python"

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Audit what actually resolves, not what pyproject loosely permits.
      # --no-emit-project drops convexity itself: it is not published to PyPI, so
      # pip-audit --strict would otherwise fail trying to look it up rather than
      # auditing our third-party dependencies.
      - name: Export resolved dependencies
        run: uv export --format requirements-txt --no-hashes --all-extras --no-emit-project -o /tmp/resolved.txt
      - name: pip-audit
        run: uvx pip-audit --requirement /tmp/resolved.txt --strict --progress-spinner=off

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: moderate
          # A dependency whose licence forbids redistribution would silently
          # contaminate our Apache-2.0 distribution.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # full history: a secret removed from HEAD is still leaked
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
      # Exclude .git/ itself: with --all-files, detect-secrets walks the internal
      # git files too, and a commit SHA in .git/FETCH_HEAD trips the high-entropy
      # plugin. Those are our own object IDs, not credentials, and their presence
      # varies by checkout (why this passed on a push but failed on a PR).
      - name: Scan history for credentials
        run: uvx detect-secrets scan --all-files --force-use-all-plugins --exclude-files '^\.git/' > /tmp/secrets.json
      - name: Fail on findings
        run: |
          python3 - <<'PY'
          import json, sys
          with open("/tmp/secrets.json") as fh:
              results = json.load(fh).get("results", {})
          if results:
              print("Potential secrets detected:")
              for path, findings in results.items():
                  for finding in findings:
                      print(f"  {path}:{finding.get('line_number')} {finding.get('type')}")
              sys.exit(1)
          print("No secrets detected.")
          PY

  no-shipped-data:
    name: No provider data or private files in artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build
      # Belt and braces alongside the same check in CI: this is the control that
      # keeps licensed provider data and private working files out of a release,
      # and a release is not reversible.
      - name: Verify artefact contents
        run: uv run --no-project python scripts/check_artefacts.py
