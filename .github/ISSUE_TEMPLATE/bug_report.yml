name: Bug report
description: Something behaves incorrectly (not a metric value)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: python
    validations: {required: true}
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Output of `python -c "import convexity; convexity.show_versions()"`
      render: text
    validations: {required: true}
