site_name: convexity
site_description: >-
  Quantitative finance analytics with explicit conventions, documented formulas,
  and honest failure modes.
site_author: Demi Oyeyemi
repo_url: https://github.com/demilade-o/convexity
repo_name: demilade-o/convexity
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Demi Oyeyemi — Apache-2.0

# Warnings are errors: a broken cross-reference is a broken document, and the
# documentation is part of the product here.
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    # Both schemes are provided: a reader's system preference is a preference.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Five-minute start: getting-started.md
  - Concepts:
      - Conventions: concepts/conventions.md
      - Point-in-time data: concepts/point-in-time.md
      - Risk-free rates: concepts/risk-free-rates.md
      - Data providers: concepts/data-providers.md
  - Metric catalogue: metrics/index.md
  - Tutorials:
      - Performance analysis: tutorials/performance-analysis.md
  - Providers:
      - Provider matrix: providers/provider-matrix.md
  - API reference: reference/api.md
  - Project:
      - Limitations: limitations.md
      - Requirements: development/requirements.md
      - Traceability: development/traceability.md
      - Release evidence: development/release-candidate-evidence.md
      - Decisions: adr/README.md
